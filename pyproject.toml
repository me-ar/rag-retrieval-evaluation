[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbench"
version = "1.0.0"
description = "Benchmarking retrieval for RAG: BM25 vs dense vs hybrid vs cross-encoder re-ranking"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 115

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
per-file-ignores = { "src/ragbench/experiment.py" = ["E402"] }
